version: '3.8'

services:
  # Main application - demo mode
  green-computing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: green-computing
    volumes:
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - DEVICE=cpu
    command: ["demo"]

  # Training service
  training:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: green-computing-training
    volumes:
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - DEVICE=cpu
    command: ["train", "--epochs", "50"]
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  # Test service
  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: green-computing-test
    entrypoint: ["python", "-m", "pytest"]
    command: ["tests/", "-v", "--cov=src", "--cov-report=term-missing"]

  # TensorBoard service
  tensorboard:
    image: tensorflow/tensorflow:latest
    container_name: green-computing-tensorboard
    ports:
      - "6006:6006"
    volumes:
      - ./outputs:/outputs
    command: tensorboard --logdir=/outputs --host=0.0.0.0 --port=6006
    profiles:
      - monitoring
